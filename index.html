<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet" />
  <title>Snack Shack</title>
  <style>
    :root {
      --bg: #f5f0e8;
      --surface: #fffdf8;
      --surface-soft: #eee5d8;
      --text: #2f2a25;
      --muted: #6f665d;
      --accent: #b85c38;
      --accent-2: #d59a43;
      --accent-3: #7b8760;
      --border: #dfd3c4;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Nunito Sans", sans-serif;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .material-symbols-outlined {
      font-family: "Material Symbols Outlined";
      font-weight: 400;
      font-style: normal;
      font-size: 1em;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    .container {
      width: min(1160px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Bowlby One SC", sans-serif;
      font-weight: 400;
      letter-spacing: -0.04em;
      font-size: clamp(1.25rem, 2vw, 1.65rem);
    }

    .logo-badge {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--accent-2);
      color: var(--surface);
      transform: rotate(-7deg);
    }

    .logo-badge .material-symbols-outlined {
      font-size: 1.8rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--muted);
    }

    .nav-links a {
      padding: 10px 14px;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text);
      background: var(--surface-soft);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      min-height: 620px;
      gap: 48px;
      padding: 72px 0 46px;
    }

    h1 {
      font-family: "Bowlby One SC", sans-serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 8vw, 7.7rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
    }

    .hero-title {
      color: var(--text);
    }

    .hero p {
      max-width: 620px;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 30px;
    }

    .btn {
      font-family: "Nunito Sans", sans-serif;
      border: 0;
      cursor: pointer;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.98rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-secondary {
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .hero-media {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image {
      display: block;
      width: min(100%, 560px);
      height: auto;
      filter: drop-shadow(0 12px 16px rgba(74, 54, 38, 0.14));
    }

    section {
      padding: 74px 0;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    h2 {
      font-family: "Bowlby One SC", sans-serif;
      font-weight: 400;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .section-heading h2 {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-icon {
      color: var(--accent);
      font-size: 0.8em;
    }

    .section-heading p {
      max-width: 420px;
      color: var(--muted);
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .snack-card {
      position: relative;
      min-height: 280px;
      padding: 22px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 8px 18px rgba(74, 54, 38, 0.08);
      overflow: hidden;
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease;
    }

    .snack-card:hover {
      transform: translateY(-2px);
      background: var(--surface);
      border-color: #cdbba7;
    }

    .snack-image {
      display: block;
      width: 100%;
      height: 120px;
      object-fit: contain;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
      filter: none;
    }

    .snack-icon {
      display: grid;
      place-items: center;
      width: 100%;
      height: 120px;
      margin-bottom: 18px;
      color: var(--accent-3);
      font-size: 4.5rem;
      position: relative;
      z-index: 1;
    }

    .snack-card h3 {
      font-family: "Bowlby One SC", sans-serif;
      font-weight: 400;
      font-size: 1.25rem;
      margin-bottom: 7px;
      letter-spacing: 0;
    }

    .snack-card p {
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.5;
      min-height: 42px;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 950;
      color: var(--accent);
    }

    .info-card {
      padding: 28px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .info-card h3 {
      margin-bottom: 9px;
      font-size: 1.2rem;
    }

    .info-card p {
      color: var(--muted);
      line-height: 1.6;
    }

    footer {
      padding: 34px 0 46px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 620px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        padding-top: 48px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .section-heading {
        display: block;
      }

      .section-heading p {
        margin-top: 12px;
      }

    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="#top" aria-label="Snack Shack home">
        <span class="logo-badge"><span class="material-symbols-outlined" aria-hidden="true">fastfood</span></span>
        <span>Snack Shack</span>
      </a>
    </div>
  </header>

  <main id="top">
    <section class="hero container">
        <div>
        <h1><span class="hero-title">Snack Shack</span></h1>
        </div>

      <div class="hero-media">
        <img class="hero-image" src="images/hero.png" alt="Assorted snack packages and chips" />
      </div>
    </section>

    <section id="menu" class="container">
      <div class="section-heading">
        <div>
          <h2><span class="material-symbols-outlined section-icon" aria-hidden="true">restaurant_menu</span>Our menu</h2>
        </div>
      </div>

      <div class="grid" id="snackGrid"></div>
    </section>

    <section id="visit" class="container">
      <div class="section-heading">
        <h2><span class="material-symbols-outlined section-icon" aria-hidden="true">location_on</span>Location and payment</h2>
        <p>The snack table is near the main quad during lunch. Cash is accepted.</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">Snack Shack</div>
  </footer>

  <script>
    const snacks = [
      { name: "Doritos", category: "Chips", price: 1.25, image: "images/doritos.png", description: "Corn chips with a cheese flavor." },
      { name: "Hot Cheetos", category: "Chips", price: 1.50, image: "images/hot_cheeto.png", description: "Spicy corn chips." },
      { name: "Takis", category: "Chips", price: 1.50, image: "images/takis.png", description: "Rolled corn tortilla chips with a spicy flavor." },
      { name: "KitKat", category: "Candy", price: 1.50, image: "images/kitkat.png", description: "A chocolate-covered wafer bar." },
      { name: "Reese's", category: "Candy", price: 1.50, image: "images/reeses.png", description: "Chocolate and peanut butter candy." },
      { name: "Skittles", category: "Candy", price: 1.25, image: "images/skittles.png", description: "Small, colorful candy pieces." },
      { name: "Sour Patch Kids", category: "Candy", price: 1.25, image: "images/sour_patch_kids.png", description: "Soft candy with a sour coating." },
      { name: "Trolli", category: "Candy", price: 1.25, image: "images/trolli.png", description: "Soft, chewy gummy candy." },
      { name: "Iced Tea", category: "Drinks", price: 1.75, icon: "local_drink", description: "Iced tea." },
      { name: "Granola Bar", category: "Healthy", price: 1.25, icon: "grain", description: "A granola bar." },
      { name: "Fruit Cup", category: "Healthy", price: 2.00, icon: "nutrition", description: "A cup of fruit." },
      { name: "Popcorn", category: "Snacks", price: 1.00, icon: "local_movies", description: "Popcorn." }
    ];

    const snackGrid = document.getElementById("snackGrid");

    function formatMoney(value) {
      return value.toLocaleString("en-US", { style: "currency", currency: "USD" });
    }

    function renderSnacks() {
      snackGrid.innerHTML = snacks.map(item => `
          <article class="snack-card">
            ${item.image ? `<img class="snack-image" src="${item.image}" alt="${item.name}" />` : `<span class="material-symbols-outlined snack-icon" aria-hidden="true">${item.icon}</span>`}
            <h3>${item.name}</h3>
            <p>${item.description}</p>
            <div class="card-bottom">
              <span class="price">${formatMoney(item.price)}</span>
            </div>
          </article>
        `).join("");
    }

    renderSnacks();
  </script>
</body>
</html>
